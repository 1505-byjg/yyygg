  <script src="js/main.js?v=20260816a"></script>
  <script src="js/reader-guard.js"></script>
  <script>
    (function () {
      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      }); }
      var box = document.getElementById("ruleList");
      fetch("/api/rules").then(function (r) { return r.json(); }).then(function (d) {
        var list = (d && d.rules) || [];
        if (!list.length) { box.innerHTML = '<p class="m-text-soft">暂无规则。</p>'; return; }
        box.innerHTML = list.map(function (r) {
          var colorStyle = r.theme === "orange" ? "color:var(--m-orange-700)" : (r.theme === "blue" ? "color:var(--m-blue-700)" : "");
          var lines = (r.content || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
          var bodyHtml = lines.length > 1
            ? '<ul class="m-text-soft" style="line-height:1.9;padding-left:20px">' + lines.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul>"
            : '<p class="m-text-soft" style="line-height:1.8">' + esc(lines[0] || "") + "</p>";
          return '<div class="card" style="padding:22px;margin-bottom:18px"><h4 style="margin:0 0 8px;' + colorStyle + '">' + esc(r.title || "(无标题)") + "</h4>" + bodyHtml + "</div>";
        }).join("");
      }).catch(function () { box.innerHTML = '<p class="m-text-soft">规则加载失败。</p>'; });
    })();
  </script>
