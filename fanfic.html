  <!-- auto-reload on deploy: 检测到 version.txt 变化则自动强刷，根治移动端缓存空白 -->
  <script>
  (function(){
    try{
      var KEY="_site_ver_";
      var xhr=new XMLHttpRequest();
      xhr.open("GET","version.txt?_="+Date.now(),true);
      xhr.onreadystatechange=function(){
        if(xhr.readyState===4 && xhr.status===200){
          var v=(xhr.responseText||"").trim();
          if(!v) return;
          var old=localStorage.getItem(KEY);
          try{ localStorage.setItem(KEY,v); }catch(e){}
          if(old && old!==v){ location.reload(true); }
        }
      };
      xhr.send();
    }catch(e){}
  })();
  </script>
