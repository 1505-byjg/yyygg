<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>阅读 · 摇摇又汞汞</title>
  <link rel="icon" href="images/favicon.svg" />
  <link rel="stylesheet" href="css/reader-guard.css" />
  <link rel="stylesheet" href="css/reader.css" />
  <script src="js/static-api.js"></script>
</head>
<body class="reader-page" data-page="reader">

  <!-- 阅读进度 -->
  <div class="reader-progress" id="rProgress"></div>

  <!-- 可隐藏顶栏 -->
  <header class="reader-topbar" id="rTopbar">
    <a class="rtb-btn rtb-back" href="fanfic.html" title="返回同人专区">← <span class="lbl">返回</span></a>
    <div class="rtb-title dim" id="rTitle">同人专区 · 阅读</div>
    <div class="rtb-right">
      <button class="rtb-btn r-mode-btn" id="rModeBtn" title="连续阅读全部章节">📖 <span class="lbl">连续</span></button>
      <button class="rtb-btn" id="rTocBtn" title="章节目录">☰ <span class="lbl">目录</span></button>
      <button class="rtb-btn" id="rSetBtn" title="阅读设置">⚙ <span class="lbl">设置</span></button>
    </div>
  </header>

  <!-- 主体 -->
  <div class="reader-root" id="rRoot">
    <!-- 加载 / 错误态 -->
    <div class="reader-state" id="rState">
      <div class="em">📖</div>
      <h3>正在载入文章…</h3>
      <p>若长时间无响应，请检查网络后刷新。</p>
    </div>
    <!-- 正文（由 reader.js 注入） -->
    <div class="reader-shell" id="rShell" style="display:none">
      <article class="reader-article" id="rArticle">
        <h1 class="reader-title" id="rArticleTitle"></h1>
        <div class="reader-meta" id="rArticleMeta"></div>
        <div class="reader-tags" id="rArticleTags"></div>
        <div id="rArticleCover"></div>
        <div class="reader-content" id="rContent"></div>
      </article>

      <div class="reader-foot" id="rFoot" style="display:none">
        <div class="reader-ch-indicator" id="rChIndicator"></div>
        <div class="reader-ch-quick" id="rChQuick"></div>
        <div class="reader-chapters" id="rChapters"></div>
        <div class="reader-copyright">
          <div class="rg-c-title">版权声明</div>
          <p>同人作品均为粉丝原创，版权归作者所有。转载请获取授权，严禁商用、二改。</p>
          <p>本文含防盗水印，请勿截图、录屏或搬运盗文。</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 遮罩 -->
  <div class="reader-backdrop" id="rBackdrop"></div>

  <!-- 章节目录抽屉 -->
  <aside class="reader-panel toc" id="rTocPanel">
    <h4>章节目录 <button class="close" data-close="toc" aria-label="关闭">×</button></h4>
    <ul class="toc-list" id="rTocList"></ul>
  </aside>

  <!-- 阅读设置抽屉 -->
  <aside class="reader-panel set" id="rSetPanel">
    <h4>阅读设置 <button class="close" data-close="set" aria-label="关闭">×</button></h4>

    <div class="set-group">
      <div class="lab">主题</div>
      <div class="seg orange" data-seg="theme">
        <button data-v="light">日间</button>
        <button data-v="sepia">护眼</button>
        <button data-v="night">夜间</button>
      </div>
    </div>

    <div class="set-group">
      <div class="lab">字号</div>
      <div class="seg" data-seg="fz">
        <button data-v="16">小</button>
        <button data-v="18">标准</button>
        <button data-v="20">大</button>
        <button data-v="22">超大</button>
      </div>
    </div>

    <div class="set-group">
      <div class="lab">字体</div>
      <div class="seg" data-seg="ff">
        <button data-v="sans">无衬线</button>
        <button data-v="serif">衬线</button>
      </div>
    </div>

    <div class="set-group">
      <div class="lab">行距</div>
      <div class="seg" data-seg="lh">
        <button data-v="1.7">紧凑</button>
        <button data-v="1.95">适中</button>
        <button data-v="2.2">宽松</button>
      </div>
    </div>

    <div class="set-group">
      <div class="lab">页宽</div>
      <div class="seg" data-seg="w">
        <button data-v="640">窄</button>
        <button data-v="720">标准</button>
        <button data-v="820">宽</button>
      </div>
    </div>
  </aside>

  <!-- 防盗：滚动水印 + 防复制 + 截图提示（读者页启用） -->
  <script src="js/reader-guard.js"></script>
  <script src="js/reader.js?v=20260809c"></script>
</body>
</html>
